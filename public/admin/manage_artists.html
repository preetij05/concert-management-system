<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Artists</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f7fb; }
    h1 { color: #3B5BA9; }
    a { text-decoration: none; color: #3B5BA9; margin-right: 15px; font-weight: bold; }
    a:hover { color: #FFD447; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    table, th, td { border: 1px solid #ccc; }
    th, td { padding: 10px; text-align: center; }
    input, button { padding: 8px; margin: 5px 0; }
    button { cursor: pointer; background: #3B5BA9; color: white; border: none; border-radius: 5px; }
    button:hover { background: #FFD447; color: #2C3E50; }
  </style>
</head>
<body>

  <!-- Back links -->
  <div>
    <a href="dashboard.html">← Back to Dashboard</a> |
    <a href="../index.html">← Back to Home</a>
  </div>

  <h1>Manage Artists</h1>

  <!-- Add / Edit Artist Form -->
  <form id="artistForm">
    <input type="hidden" name="artist_id" id="artist_id">
    <input type="text" name="name" id="name" placeholder="Artist Name" required>
    <input type="text" name="genre" id="genre" placeholder="Genre" required>
    <button type="submit" id="submitBtn">Add Artist</button>
  </form>

  <!-- Artist List -->
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Genre</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="artistList"></tbody>
  </table>

  <script>
  const artistForm = document.getElementById('artistForm');
  const artistList = document.getElementById('artistList');
  const submitBtn = document.getElementById('submitBtn');

  // ---------------- Fetch and display artists ----------------
  const fetchArtists = async () => {
    try {
      const res = await fetch('/api/admin/artists');
      const artists = await res.json();

      artistList.innerHTML = artists.map(a => `
        <tr>
          <td>${a.artist_id}</td>
          <td>${a.artist_name}</td>
          <td>${a.genre}</td>
          <td>
            <button onclick="editArtist(${a.artist_id}, '${a.artist_name}', '${a.genre}')">Edit</button>
            <button onclick="deleteArtist(${a.artist_id})">Delete</button>
          </td>
        </tr>
      `).join('');
    } catch (error) {
      console.error('Error fetching artists:', error);
    }
  };

  // ---------------- Add or update artist ----------------
  artistForm.addEventListener('submit', async e => {
    e.preventDefault();

    const artist_id = document.getElementById('artist_id').value;
    const data = {
      name: document.getElementById('name').value,
      genre: document.getElementById('genre').value
    };

    try {
      if (artist_id) {
        await fetch(`/api/admin/artists/${artist_id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      } else {
        await fetch('/api/admin/artists', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
      }

      artistForm.reset();
      submitBtn.textContent = 'Add Artist';
      fetchArtists();
    } catch (error) {
      console.error('Error saving artist:', error);
    }
  });

  // ---------------- Edit artist ----------------
  const editArtist = (id, name, genre) => {
    document.getElementById('artist_id').value = id;
    document.getElementById('name').value = name;
    document.getElementById('genre').value = genre;
    submitBtn.textContent = 'Update Artist';
  };

  // ---------------- Delete artist ----------------
  const deleteArtist = async id => {
    if (confirm('Are you sure you want to delete this artist?')) {
      try {
        await fetch(`/api/admin/artists/${id}`, { method: 'DELETE' });
        fetchArtists();
      } catch (error) {
        console.error('Error deleting artist:', error);
      }
    }
  };

  // ---------------- Initial load ----------------
  fetchArtists();
</script>


</body>
</html>
