<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manage Concerts</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background: #f5f7fb; }
  h1 { color: #3B5BA9; }
  a { text-decoration: none; color: #3B5BA9; margin-right: 15px; font-weight: bold; }
  a:hover { color: #FFD447; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  table, th, td { border: 1px solid #ccc; }
  th, td { padding: 10px; text-align: center; }
  input, select, button { padding: 8px; margin: 5px 0; }
  button { cursor: pointer; background: #3B5BA9; color: white; border: none; border-radius: 5px; }
  button:hover { background: #FFD447; color: #2C3E50; }
  form {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: 16px;
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}

form input[type="text"],
form input[type="date"],
form select:not(#artist_ids) {
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 8px 10px;
  font-size: 0.95em;
}

form input:focus,
form select:focus {
  outline: none;
  border-color: #3B5BA9;
  box-shadow: 0 0 0 2px rgba(59, 91, 169, 0.15);
}

.artist-group {
  display: flex;
  flex-direction: column;
}

.artist-group label {
  font-size: 0.85em;
  margin-bottom: 6px;
  color: #555;
}

#artist_ids {
  border: 1px solid #ccc;
  border-radius: 6px;
  padding: 4px;
  min-width: 200px;
  font-size: 0.95em;
}

#artist_ids option {
  padding: 6px 8px;
  border-radius: 4px;
}

#artist_ids option:checked {
  background: #3B5BA9;
  color: white;
}

form button[type="submit"] {
  align-self: flex-start;
  margin-top: 22px;
  padding: 10px 20px;
  font-size: 0.95em;
}
</style>
</head>
<body>

<div>
<a href="dashboard.html">← Back to Dashboard</a> |
<a href="../index.html">← Back to Home</a>
</div>

<h1>Manage Concerts</h1>

<!-- Add / Edit Concert Form -->
<form id="concertForm">
  <input type="hidden" id="concert_id">
  <input type="text" id="concert_name" placeholder="Concert Name" required>
  <input type="date" id="concert_date" required>
  <select id="venue_id" required></select>
  <div class="artist-group">
  <label for="artist_ids">Artists (Ctrl/Cmd-click to select multiple)</label>
  <select id="artist_ids" multiple size="5" required></select>
</div>
  <button type="submit" id="submitBtn">Add Concert</button>
</form>

<table>
<thead>
<tr>
  <th>ID</th>
  <th>Name</th>
  <th>Date</th>
  <th>Venue</th>
  <th>Artists</th>
  <th>Actions</th>
</tr>
</thead>
<tbody id="concertList"></tbody>
</table>

<script>
  const concertForm = document.getElementById('concertForm');
  const concertList = document.getElementById('concertList');
  const submitBtn = document.getElementById('submitBtn');
  const venueSelect = document.getElementById('venue_id');
  const artistSelect = document.getElementById('artist_ids');

  // ---------------- Load venues ----------------
  const fetchVenues = async () => {
    try {
      const res = await fetch('/api/admin/venues');
      const venues = await res.json();
      venueSelect.innerHTML = venues.map(v => `<option value="${v.venue_id}">${v.venue}</option>`).join('');
    } catch (error) {
      console.error('Error fetching venues:', error);
    }
  };

  // ---------------- Load artists ----------------
  const fetchArtists = async () => {
    try {
      const res = await fetch('/api/admin/artists');
      const artists = await res.json();
      artistSelect.innerHTML = artists.map(a => `<option value="${a.artist_id}">${a.artist_name}</option>`).join('');
    } catch (error) {
      console.error('Error fetching artists:', error);
    }
  };

  // ---------------- Helper: format date ----------------
  const formatDate = dateStr => {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-US', {
      month: 'short',
      day: 'numeric',
      year: 'numeric'
    });
  };

  // ---------------- Load concerts ----------------
const fetchConcerts = async () => {
  try {
    const res = await fetch('/api/admin/concerts');
    const concerts = await res.json();

    concertList.innerHTML = concerts.map(c => {
      const artistNames = Array.isArray(c.artists) ? c.artists.join(', ') : (c.artists || '');
      const formattedDate = formatDate(c.concert_date);

      return `
        <tr data-id="${c.concert_id}" data-name="${c.concert_name.replace(/"/g, '&quot;')}" 
            data-date="${c.concert_date}" data-venue="${c.venue_id}" 
            data-artists="${(c.artists_ids || []).join(',')}">
          <td>${c.concert_id}</td>
          <td>${c.concert_name}</td>
          <td>${formattedDate}</td>
          <td>${c.venue}</td>
          <td>${artistNames}</td>
          <td>
            <button class="editBtn">Edit</button>
            <button class="deleteBtn">Delete</button>
          </td>
        </tr>
      `;
    }).join('');
  } catch (error) {
    console.error('Error fetching concerts:', error);
  }
};

// ---------------- Row button clicks (event delegation) ----------------
concertList.addEventListener('click', e => {
  const row = e.target.closest('tr');
  if (!row) return;

  const id = row.dataset.id;

  if (e.target.classList.contains('editBtn')) {
    const artist_ids = row.dataset.artists ? row.dataset.artists.split(',').map(Number) : [];
    editConcert(id, row.dataset.name, row.dataset.date, row.dataset.venue, artist_ids);
  }

  if (e.target.classList.contains('deleteBtn')) {
    deleteConcert(id);
  }
});

  // ---------------- Add / Update concert ----------------
concertForm.addEventListener('submit', async e => {
  e.preventDefault();

  const concert_id = document.getElementById('concert_id').value;
  const selectedArtists = Array.from(artistSelect.selectedOptions).map(o => parseInt(o.value));
  const data = {
    concert_name: document.getElementById('concert_name').value,
    concert_date: document.getElementById('concert_date').value,
    venue_id: parseInt(venueSelect.value),
    artist_ids: selectedArtists
  };

  try {
    const url = concert_id ? `/api/admin/concerts/${concert_id}` : '/api/admin/concerts';
    const method = concert_id ? 'PUT' : 'POST';

    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await res.json();

    if (!res.ok) {
      alert(result.error || 'Failed to save concert.');
      return;
    }

    concertForm.reset();
    submitBtn.textContent = 'Add Concert';
    fetchConcerts();
  } catch (error) {
    console.error('Error saving concert:', error);
    alert('Something went wrong while saving the concert.');
  }
});

  // ---------------- Edit concert ----------------
const editConcert = (id, name, date, venue_id, artist_ids) => {
  document.getElementById('concert_id').value = id;
  document.getElementById('concert_name').value = name;
  document.getElementById('concert_date').value = date.split('T')[0]; // trims timestamp to YYYY-MM-DD
  venueSelect.value = venue_id;
  Array.from(artistSelect.options).forEach(o => o.selected = artist_ids.includes(parseInt(o.value)));
  submitBtn.textContent = 'Update Concert';
};

  // ---------------- Delete concert ----------------
const deleteConcert = async id => {
  if (confirm('Are you sure you want to delete this concert?')) {
    try {
      const res = await fetch(`/api/admin/concerts/${id}`, { method: 'DELETE' });
      const data = await res.json();

      if (!res.ok) {
        alert(data.error || 'Failed to delete concert.');
        return;
      }

      fetchConcerts();
    } catch (error) {
      console.error('Error deleting concert:', error);
      alert('Something went wrong while deleting the concert.');
    }
  }
};

  // ---------------- Initial load ----------------
  fetchVenues();
  fetchArtists();
  fetchConcerts();
</script>



</body>
</html>
