<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concert Management System</title>
  <style>
    :root {
      --primary: #3B5BA9;
      --accent: #FFD447;
      --light-bg: #F5F7FB;
      --text-dark: #2C3E50;
      --text-light: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--light-bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      gap: 40px;
    }

    .content {
      flex: 1;
    }

    h1 {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 20px;
    }

    p {
      color: var(--text-dark);
      font-size: 1.1rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .buttons a {
      text-decoration: none;
      color: var(--text-light);
      background: var(--primary);
      padding: 12px 28px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s;
    }

    .buttons a:hover {
      background: var(--accent);
      color: var(--text-dark);
      transform: translateY(-3px);
    }

    .Concert {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .Concert img {
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 800px) {
      .container {
        flex-direction: column;
        padding: 30px 25px;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
      }

      .buttons {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>Concert Management System</h1>
      <p>Simplify event planning and keep every detail in tune!</p>
      <div class="buttons">
        <a href="/customer/login.html">Customer Portal</a>
        <a href="/admin/dashboard.html">Admin Portal</a>
      </div>
    </div>
    <div class="Concert">
      <img src="images/Concert.jpg" alt="Concert illustration">
    </div>
  </div>
</body>
</html>
